<!DOCTYPE html>
<html>
    <head>
        <title>
            taskbar
        </title>
        <style>
            .c {
                display:flex;
                flex-direction: row;
                justify-content:space-between;
                align-items:center;
                height:40px;
                background-color:blueviolet;
                border:none;
                width:700px;
                
            }
            .c1 {
                font-weight:bold;
                font-size:14px;
                color:white;
                
                padding-left: 15px;
            }
            .c2{
                width:210px;
            }
            .c3{
                width:120px;
            }
            input{
                font-size:13px;
                width:300px;
                border:none;
                outline:none;
                padding:5px 10px;
                border-radius:35px;
            }
            button{
                background-color:blueviolet;
                color:white;
                border-style:solid;
                border-color:white;
                padding:5px 10px;
                font-size:13px;
            }
        </style>
    </head>
    <body>
        <div class="c">
            <div class="c1">Home</div>
            <div class="c2">
                <input type="text" placeholder="Search">
            </div>
            <div class="c3">
                <button>Download</button>
            </div>
        </div>
    </body>
</html>

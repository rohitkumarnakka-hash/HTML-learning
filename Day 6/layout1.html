<!DOCTYPE html>
<html>

<head>
    <title>
        Layout 1
    </title>

    <style>
        .main-box1 {
            width:auto;
            align-items: center;
            display: flex;
            box-shadow:0px 0px 5px 0px rgba(0,0,0,0.2);
            width:550px;
            margin-bottom:15px;
        }
        .box1 {
            width: 400px;
            display:inline-block;
            margin-left:10px;

        }

        .pro {
            width: 75px;
            height: 75px;
            display: inline-block;
            vertical-align: top;
        }

        .pro-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            margin-top: 17px;
        }

        .text {
            margin-left: 15px;
            display: inline-block;
        }

        .t1 {
            font-family: Arial;
            font-size: 18px;
            font-weight: 600;
            margin-top: 15px;


        }

        .t2 {
            font-family: Arial;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
            color: grey;
        }

        .t3 {
            font-family: Arial;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
            color: grey;
        }

        .button {
            display: inline-block;
        }
        .follow{
            background-color:rgb(71, 111, 185);
            color:white;
            font-family:Arial;
            font-size:16px;
            font-weight:bold;
            padding:10px 13px;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
    </style>
</head>

<body>
    <div class="main-box1">
    <div class="box1">
        <div class="pro">
            <img class="pro-pic" src="luffy1.jpeg">
        </div>
        <div class="text">
            <p class="t1">Monkey D. Luffy</p>
            <p class="t2">Status: Emperor</p>
            <p class="t3">CREW: Straw Hat Pirates</p>
        </div>
    </div>
    <div class="button">
        <button class="follow">Follow</button>
    </div>
    </div>
    <div class="main-box1">
    <div class="box1">
        <div class="pro">
            <img class="pro-pic" src="luffy1.jpeg">
        </div>
        <div class="text">
            <p class="t1">Monkey D. Luffy</p>
            <p class="t2">Status: Emperor</p>
            <p class="t3">CREW: Straw Hat Pirates</p>
        </div>
    </div>
    <div class="button">
        <button class="follow">Follow</button>
    </div>
    </div>
</body>

</html>

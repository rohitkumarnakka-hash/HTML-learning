<!DOCTYPE html>
<html>
    <head>
        <title>
            Layout 2
        </title>
        <style>
            .main {
                width:180px;
                height:300px;
                display:inline-block;
                vertical-align: top;
                box-shadow:0px 0px 5px 0px rgba(0,0,0,0.2);
            }

            .pickdiv {
                width:180px;
                height:180px;
            }
            .pic {
                width:180px;
                height:180px;
            }

            .profile {
                margin-left:10px;
                width:180px;
                height:120px;
                display: inline-block;
                vertical-align:top;
                 margin-top:7px;
            }
            
            .propic {
                width:22px;
            
                height:22px;
                border-radius:50%;
               margin-top:0;
                vertical-align:top;

                
            }
            .t1 {
                display: inline-block;
                margin-top:2px;
                margin-left:5px;
                font-size:11px;
                color:grey;
                font-weight:bold;
            }

            .friend {
                background-color:royalblue;
                color:white;
                font-size:15px;
                font-weight:bold;
                border:none;
                border-radius:4px;
                padding:10px 13px;
                cursor:pointer;
                display:block;
                margin-top:5px;
                margin-bottom:5px;
                margin-left:16px; 
            }

            .name {
                font-size:18px;
                font-family:Arial;
                font-weight:bold;
                margin-top:5px;
                margin-bottom:7px;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="picdiv">
                <img class="pic" src="luffy1.jpeg">
            </div>
            <div class="profile">
                <p class="name">Oliver</p>
                <img class="propic" src="luffy1.jpeg">
                <p class="t1">2 Mututal friends</p>
                <button class="friend">Add Friend</button>
                
            </div>
        </div>
    </body>
</html>

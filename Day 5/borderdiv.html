<!DOCTYPE html>
<html>
    <head>
        <title>division border</title>
        <style>
            .border{
                border-style:solid;
                border-radius:5px;
                width:200px;
            }

            p{
                font-family:Arial;
                font-size:16px;
                font-weight:bond;
            }

            .yes,
            .no{
                color:black;
                font-size:14px;
                padding:5px 5px;
                margin:7px 5px;
                border-style:solid;
            }
        </style>
    </head>
    <body>
        <div class="border">
            <p>Satisfied with our Service?</p>
            <button class="yes">Yes</button>
            <button class="no">No</button>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>search-shadow</title>
        <style>
            .Sear{
                font-size:16px;
                width:300px;
                border-radius:20px;
                border:none;
                cursor:pointer;
                padding:10px 15px;
                box-shadow:0px 4px 12px rgba(0,0,0,0.2);
                outline:none;
                transition:box-shadow 1s;
            }
            .Sear:focus{
                box-shadow:0px 4px 15px rgba(0,0,0,0.3);
            }
        </style>
    </head>
    <body>
        <input class="Sear" type="text" placeholder="Search Google or type a URL"/>
    </body>
</html>

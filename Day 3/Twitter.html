<!DOCTYPE html>
<html>
    <head>
        <title>Twitter text book</title>
        <style>
            body{
                display:flex;
                align-items:center;
            }
            .cat{
                width:40px;
                height:40px;
                border-radius:50%;

            }
            p{
                font-family:Arial;
                font-size:18px;
                margin-left:10px;
            }
            button{
                background-color:rgb(27, 121, 229);
                border:none;
                color:white;
                border-radius:25px;
                padding:10px 18px;
                cursor:pointer;
                margin-left:80px;
                 font-weight:bold;
            }
        </style>
    </head>
    <body>
        <img class="cat" src="image1.jpg">
        <p>What's happening?</p>
        <button>Tweet</button>
    </body>
</html>

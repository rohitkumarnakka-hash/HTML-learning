<!doctype html>
<html>
  <head>
    <title>LinkedIn signup</title>
    <style>
        p{
            font-family:Arial;
            font-size:13px;
        }
        .Email{
            width:300px;
            border-style:solid;
            border-radius:3px;
        }
        button{
            background-color:rgb(27, 121, 229);
            color:white;
            font-size:14px;
            padding:15px 100px;
            border:none;
            border-radius:38px;
            cursor:pointer;
            transition:padding 0.25s;
            margin-left:10px;
        }
        
        button:active{
            padding:13px 90px;
        }
    </style>
  </head>
  <body>
    <p>Email</p>
    <input class="Email" type="text" />
    <p>By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button>Agree & Join</button>
  </body>
</html>

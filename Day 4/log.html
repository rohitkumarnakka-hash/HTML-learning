<!DOCTYPE html>
<html>
    <head>
        <title>sign up</title>
        <style>
            input{
                border-style:solid;
                border-color:grey;
                color:grey;
                padding:12px 12px;
                border-radius:5px;
                width:145px;
                font-size:15px;
                outline:none;
            }
            .b3{
                display:block;
                width:320px;
                margin:14px 0;
            }
            button{
                background-color:rgb(10,102,194);
                color:white;
                font-size:14px;
                border:none;
                border-radius:5px;
                width:348px;
                padding:15px 10px;
                cursor:pointer;
            }
            
        </style>
    </head>
    <body>
        <input class="b1" type="text" placeholder="First name"/>
        <input class="b2" type="text" placeholder="Last name"/>
        <input class="b3" type="text" placeholder="Email"/>
        <button>Sign Up</button>
    </body>
</html>

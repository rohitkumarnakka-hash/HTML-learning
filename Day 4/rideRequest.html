<!doctype html>
<html>
  <head>
    <title>request duplicate</title>
    <style>
      p {
        font-family: Arial;
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 10px;
      }
      input {
        background-color: rgb(249, 247, 247);
        color: grey;
        display: block;
        width: 300px;
        padding: 12px 12px;
        font-size: 15px;
        margin-bottom: 10px;
        border: none;
        outline: none;
      }
      .now {
        background-color: black;
        color: white;
        padding: 15px 15px;
        width: 120px;
        margin: 10px 10px;
        font-size: 15px;
        border: none;
        cursor: pointer;
      }
      .later {
        background-color: rgb(249, 247, 247);
        color: black;
        padding: 15px 15px;
        width: 150px;
        font-size: 15px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Request a ride now</p>
    <input type="text" placeholder="Enter pickup location" />
    <input type="text" placeholder="Enter destination" />
    <button class="now">Request now</button>
    <button class="later">Schedule for later</button>
  </body>
</html>

<style>
    button{
        background-color:rgb(108, 168, 19);
        padding:15px 25px;
        margin:0 10px;
        border:none;
        cursor:pointer;
        transition:box-shadow 0.15s,padding 0.15s;
    }
    button:hover{
        padding:19px 29px;
        box-shadow:5px 5px 10px rgba(0,0,0,0.5);
    }
    button:active{
        box-shadow:5px 5px 8px rgba(0,0,0,0.8);
        padding:20px 30px;
    }
</style>

<button>
    Shadow
</button>

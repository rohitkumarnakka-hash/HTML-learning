<style>
    .ht{
        background-color:rgb(200, 0, 0);
        color:white;
        height:45px;
        width:130px;
        border:none;
        border-radius:4px;
        cursor:pointer;
        font-size:16px;
    }
    .ht:hover{
        opacity:0.8;
    }
    .ht:active{
        opacity:0.5;
    }
    .tele{
        background-color:white;
        color:rgb(7, 136, 211);
        border-style:solid;
        border-color:rgb(7, 136, 211);
        height:45px;
        width:110px;
        border-radius:2px;
        cursor:pointer;
        margin-left:10px;
        font-size:16px;
        transition:background-color 0.25s,color 0.25s;
    }
    .tele:hover{
        background-color:rgb(7, 136, 211);
        color:white;
    }
    .tweet{
        background-color:rgb(12, 116, 177);
        color:white;
        height:45px;
        width:110px;
        border:none;
        border-radius:20px;
        font-size:16px;
        font-weight:550;
        cursor:pointer;
        margin-left:10px;  
        transition:box-shadow 0.15s;
    }
    .tweet:hover{
        box-shadow:5px 5px 10px rgba(0,0,0,0.15);
    }
</style>

<button class ="ht">
    SUBSCRIBE
</button>
<button class ="tele">
    JOIN
</button>
<button class ="tweet">
    Tweet
</button>
